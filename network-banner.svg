<svg width="1200" height="300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      @keyframes float1 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(15px, -12px); }
      }
      @keyframes float2 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-18px, 15px); }
      }
      @keyframes float3 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(20px, 18px); }
      }
      @keyframes float4 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-15px, -18px); }
      }
      @keyframes float5 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(12px, 20px); }
      }
      @keyframes float6 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-20px, 12px); }
      }
      @keyframes float7 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(18px, -15px); }
      }
      @keyframes float8 {
        0%, 100% { transform: translate(0, 0); }
        50% { transform: translate(-12px, -20px); }
      }
      @keyframes fadeLines {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.45; }
      }
      
      .particle {
        animation-duration: 12s;
        animation-iteration-count: infinite;
        animation-timing-function: ease-in-out;
      }
      
      .connection-lines {
        animation: fadeLines 6s ease-in-out infinite;
      }
      
      .connection-lines line {
        stroke: rgba(100, 180, 255, 0.4);
        stroke-width: 1;
      }
    </style>
  </defs>
  
